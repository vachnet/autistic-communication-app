name: iOS Simulator app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build and check simulator app
        run: python3 scripts/build_ios_simulator.py
      - uses: actions/upload-artifact@v4
        with:
          name: communicate-together-ios-simulator
          path: artifacts/*.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-lockfile
          path: package-lock.json
